{% extends "admin/base_admin.html" %}
{% block title %}{{ title }} — Süleymaniye Okulu{% endblock %}
{% block content %}

<div class="section-head page-head">
  <h2 class="section-title">{{ title }}</h2>
  <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">← Panele Dön</a>
</div>

<form method="post" enctype="multipart/form-data" class="form-panel stack">
  <label>Başlık *
    <input type="text" name="title" required value="{{ article.title if article else '' }}">
  </label>

  <div class="form-row">
    <label>Kategori
      <select name="category">
        {% for slug, name in categories.items() %}
          <option value="{{ slug }}" {% if article and article.category == slug %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Durum
      <select name="status">
        <option value="published" {% if article and article.status == 'published' %}selected{% endif %}>Yayında</option>
        <option value="draft" {% if article and article.status == 'draft' %}selected{% endif %}>Taslak</option>
      </select>
    </label>
  </div>

  <label>Özet (liste sayfalarında kısa açıklama)
    <textarea name="summary" rows="2">{{ article.summary if article else '' }}</textarea>
  </label>

  <label>İçerik *
    <textarea name="content" rows="10" required>{{ article.content if article else '' }}</textarea>
  </label>

  {% if article and article.image %}
    <div class="thumb-row">
      <img src="{{ url_for('static', filename='uploads/' ~ article.image) }}" alt="Kapak">
      <label class="checkbox"><input type="checkbox" name="remove_image" value="1"> Mevcut görseli kaldır</label>
    </div>
  {% endif %}

  <label>Kapak Görseli (png, jpg, gif, webp)
    <input type="file" name="image" accept="image/png,image/jpeg,image/gif,image/webp">
  </label>

  <div class="form-actions">
    <button type="submit" class="btn">Kaydet</button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">Vazgeç</a>
  </div>
</form>
{% endblock %}
