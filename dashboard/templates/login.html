<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş — Bot Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">🤖</div>
    <h1>Bot Dashboard</h1>
    <p class="muted">Giriş yaparak komutları yönet.</p>
    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <input type="password" name="password" placeholder="Şifre" required autofocus>
      <button class="btn primary" type="submit">Giriş Yap</button>
    </form>
    <p class="muted small">Şifre `.env` dosyasındaki <code>DASHBOARD_PASSWORD</code> alanındadır.</p>
  </div>
</body>
</html>
